<div class="settings-page">
  <div class="page-header">
    <h1 class="page-title">Settings</h1>
  </div>

  <div class="settings-card">
    <h2 class="card-title">Display currency</h2>
    <p class="card-description">
      All portfolio values on the dashboard will be shown in this currency using
      historical exchange rates.
    </p>
    <div class="field-group">
      <label class="field-label">Base currency</label>
      <select
        class="field-select"
        [(ngModel)]="selectedCurrency"
        (ngModelChange)="onCurrencyChange($event)"
      >
        @for (c of currencies; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>
  </div>

  <div class="settings-card mt-6">
    <h2 class="card-title">Account</h2>
    <p class="card-description">Sign out of sailor on this device.</p>
    <button
      class="flex min-h-11 cursor-pointer items-center gap-2 rounded-sm border border-gold/40 bg-transparent px-4 text-sm text-muted transition-colors hover:border-error hover:text-error"
      (click)="logout()"
    >
      <lucide-icon name="LogOut" [size]="16"></lucide-icon>
      Log out
    </button>
  </div>
</div>
