@if (insight$ | async; as insight) {
  <div class="insight">
    <div class="insight-icon">
      <lucide-icon name="Compass" [size]="20"></lucide-icon>
    </div>
    <div class="insight-body">
      <span class="insight-label"
        >The capt<span class="ai">ai</span>n's read</span
      >
      <p class="insight-text">
        @for (segment of parseNarrative(insight.narrative); track $index) {
          <span
            [class.insight-strong]="segment.bold"
            [class.insight-positive]="segment.tone === 'positive'"
            [class.insight-negative]="segment.tone === 'negative'"
            >{{ segment.text }}</span
          >
        }
      </p>
      <span class="insight-note"
        >Facts about your portfolio, not financial advice.</span
      >
    </div>
  </div>
} @else if (loading$ | async) {
  <div class="insight insight-loading">
    <div class="insight-icon">
      <lucide-icon name="Compass" [size]="20"></lucide-icon>
    </div>
    <div class="insight-body">
      <span class="insight-label"
        >The capt<span class="ai">ai</span>n's read</span
      >
      <aws-skeleton class="h-3 w-full"></aws-skeleton>
      <aws-skeleton class="h-3 w-3/5"></aws-skeleton>
    </div>
  </div>
}
