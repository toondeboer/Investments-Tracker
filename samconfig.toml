version = 0.1

# Deploy with:  sam deploy --config-env prod
# (sam build packages the Python handlers in services/ with requirements.txt —
#  the buildspec runs it in CI.)
#
# The Captain Lambda reads the OpenAI API key from the SSM SecureString named by
# OpenAIParamName (default /sailor/openai-api-key). Create it once, out of band:
#   aws ssm put-parameter --name /sailor/openai-api-key --type SecureString --value sk-...
# For local dev, export OPENAI_API_KEY in the shell running `sam local start-api`.

[default.deploy.parameters]
stack_name = "sailor"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=\"dev\" AllowedOrigins=\"http://localhost:4200\""

[prod.deploy.parameters]
stack_name = "sailor-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "Stage=\"prod\" AllowedOrigins=\"https://sailor.toondeboer.com\" CognitoUserPoolId=\"us-east-1_liCB4LgDE\" CognitoClientId=\"3o34bbl92faeo9ljo11eebtim2\" TableName=\"sailor\" StripePriceId=\"price_1Teh4i6QCB4ocnGQUbiEpFbc\" GlobalMonthlyLimit=\"450\""
